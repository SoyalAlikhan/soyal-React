                      style={{ 
                        background: 'rgba(255,255,255,0.06)', 
                        border: '1px solid rgba(255,255,255,0.1)', 
                        borderRadius: '99px', 
                        padding: '2px 8px', 
                        fontSize: '0.72rem', 
                        color: 'var(--text-secondary)', 
                        cursor: 'pointer',
                        whiteSpace: 'nowrap'
                      }}
                      onClick={() => {
                        const newMsg = {
                          id: Date.now(),
                          sender: `${currentUser.name} (You)`,
                          text: phrase,
                          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                          isTeacher: false
                        };
                        setLiveRoomModal(prev => ({
                          ...prev,
                          chatMessages: [...prev.chatMessages, newMsg]
                        }));
                      }}
                    >
                      {phrase}
                    </button>
                  ))}
                </div>

                {/* Chat Input Form */}
                <form className="chat-input-bar" onSubmit={handleSendLiveChat}>
                  <input 
                    type="text" 
                    className="form-input" 
                    placeholder="Sawal ya Tabsera likhein..." 
                    style={{ padding: '8px 12px', fontSize: '0.84rem', borderRadius: '8px' }}
                    value={liveRoomModal.chatInput}
                    onChange={(e) => setLiveRoomModal({ ...liveRoomModal, chatInput: e.target.value })}
                  />
                  <button 
                    type="submit" 
                    className="btn btn-primary" 
                    style={{ padding: '8px 14px', borderRadius: '8px' }}
                    title="Send Message"
                  >
                    <i className="fas fa-paper-plane"></i>
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* FOOTER */}
      <footer style={{ marginTop: '64px', borderTop: '1px solid var(--border-subtle)', padding: '32px 20px', textAlign: 'center', background: 'rgba(4, 10, 18, 0.7)' }}>
        <div style={{ fontSize: '1.3rem', fontWeight: 800, color: 'var(--color-primary-light)' }}>{t.brandName}</div>
        <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)', marginTop: '6px' }}>
          © 2026 Al-Noor Open Source Islamic Academy • Comprehensive Course Studio, Live Recurring Schedulers & Auto Attendance Engine
        </div>
      </footer>
    </div>
  );
}

// Render Master Application to DOM
const rootElement = document.getElementById('root');
if (rootElement) {
  const root = ReactDOM.createRoot(rootElement);
  root.render(<App />);
}

  </script>
</body>
</html>
